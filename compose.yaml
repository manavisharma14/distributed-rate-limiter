services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    
  nginx:
    image: nginx:latest
    ports: 
      - "80:80"
    volumes:
    - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app   

  app:
    build: .
    expose: 
      - "3000"
    depends_on: 
      - redis
    environment:
      REDIS_HOST: redis
  